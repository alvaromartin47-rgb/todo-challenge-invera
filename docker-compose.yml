services:
  api:
    build: .
    container_name: invera-api
    command: python manage.py runserver 0.0.0.0:${PORT:-8000}
    volumes:
      - .:/app
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - .env
    environment:
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - invera-network
  db:
    image: postgres:18-alpine
    container_name: invera-db
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    networks:
      - invera-network
    volumes:
      - ${POSTGRES_VOLUME:-invera_data}:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  invera-network:
    name: invera-network

volumes:
  invera_data:
  invera_test_data:
